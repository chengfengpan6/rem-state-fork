name: Offline verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m rem_harness plan --config configs/smoke.json
      - name: Independently verify the archived run
        if: ${{ hashFiles('evidence/luna-smoke/calls.jsonl') != '' }}
        run: python tools/verify_recording.py evidence/luna-smoke
      - name: Replay archived responses without credentials
        if: ${{ hashFiles('evidence/luna-smoke/calls.jsonl') != '' }}
        run: python -m rem_harness replay --config configs/smoke.json --recording evidence/luna-smoke/calls.jsonl --output runs/ci-replay
