   <g id="text_12">
    <text style="font: 700 12px 'DejaVu Sans'; text-anchor: start" x="112.571875" y="16.318125" transform="rotate(-0 112.571875 16.318125)">Effect size and uncertainty</text>
   </g>
  </g>
  <g id="text_13">
   <text style="font: 9px 'DejaVu Sans'" transform="translate(9.361875 288.770062)">Secondary intervals are not simultaneous. The two secondary p values are Holm-adjusted.</text>
   <text style="font: 9px 'DejaVu Sans'" transform="translate(9.361875 298.848094)">The primary history bootstrap is a separately reported sensitivity analysis.</text>
   <text style="font: 9px 'DejaVu Sans'" transform="translate(9.361875 308.926125)">Each history averages two fixed profiles. Positive differences indicate greater prediction loss.</text>
  </g>
