[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rem-state-fork"
version = "0.1.0"
description = "Auditable synthetic-agent memory forks: a small research prototype"
requires-python = ">=3.11"
dependencies = ["scipy==1.15.3", "jsonschema==4.25.1"]

[tool.setuptools.packages.find]
include = ["rem_harness*"]
